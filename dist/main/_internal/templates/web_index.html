<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名前入力</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #66d0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    .logo {
      max-width: 300px; /*サイズ調整*/
      margin: 0 auto 30px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #e6007e;
      margin-bottom: 5px;
      text-align: left;
    }

    input[type="text"] {
      width: 300px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      background-color: #e6007e;
      color: white;
      border: none;
      padding: 10px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="{{ url_for('static', filename='images/BEAVERロゴ.png') }}" alt="BEAVER Logo" class="logo">

    <form method="POST" action="/setname">
      <div class="input-group">
        <label for="nickname">ニックネーム</label>
        <input type="text" id="nickname" name="nickname" required placeholder="ニックネームを入力して下さい…">
      </div>
      <button type="submit">確定</button>
    </form>
  </div>
</body>

</html>
